name: NEXORA APK build

permissions:
  contents: read
  actions: read
  statuses: write

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore original v1 signing key
        id: legacy-signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v1

      - name: Restore v2 signing key if v1 is unavailable
        id: current-signing
        if: steps.legacy-signing.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v2

      - name: Stop if the original signing key is unavailable
        if: steps.legacy-signing.outputs.cache-hit != 'true' && steps.current-signing.outputs.cache-hit != 'true'
        run: |
          echo "The original NEXORA signing key was not restored. Refusing to create a replacement because it would prevent updates over existing installations."
          exit 1

      - name: Verify restored NEXORA signing key
        env:
          EXPECTED_CERT_SHA256: A42DC03C2D6ABF168618697BFE423F72D2E135752E39BC2A788D77B45426272E
        run: |
          set -euo pipefail
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate mismatch. Refusing to build an APK that may not update the installed NEXORA app."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Original NEXORA signing certificate confirmed."

      - name: Show signing certificate
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA1:"

      - name: Compare historical APK signing certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nexora-old-44 /tmp/nexora-old-58
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/derrickgyamfi146-ui/NEXORA/actions/artifacts/14545343791/zip" -o /tmp/old44.zip
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/derrickgyamfi146-ui/NEXORA/actions/artifacts/14551870289/zip" -o /tmp/old58.zip
          unzip -oq /tmp/old44.zip -d /tmp/nexora-old-44
          unzip -oq /tmp/old58.zip -d /tmp/nexora-old-58
          echo "CERTIFICATE FROM HISTORICAL 0.3.0 BUILD:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/nexora-old-44/app-debug.apk
          echo "CERTIFICATE FROM HISTORICAL 0.4.0 BUILD:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs /tmp/nexora-old-58/app-debug.apk
          echo "CERTIFICATE FROM RESTORED SIGNING KEY:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:"
      - name: Build APK
        run: gradle -p android :app:assembleDebug

      - name: Verify APK signature and update compatibility
        env:
          EXPECTED_CERT_SHA256: A42DC03C2D6ABF168618697BFE423F72D2E135752E39BC2A788D77B45426272E
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          ACTUAL="$( "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "APK certificate does not match the original installed NEXORA certificate."
            exit 1
          fi
          echo "APK signature and update certificate confirmed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-0.8.2-build79
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish successful build status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="NEXORA APK build" \
            -f description="APK built and signature verified" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish failed build status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="NEXORA APK build" \
            -f description="Build failed; inspect the Actions log" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
