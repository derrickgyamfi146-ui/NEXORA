name: NEXORA APK build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/nexora-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v2

      - name: Create signing key if missing
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Show signing certificate
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|SHA1:"

      - name: Build APK
        run: gradle -p android :app:assembleDebug

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save signing key
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-0.5.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
