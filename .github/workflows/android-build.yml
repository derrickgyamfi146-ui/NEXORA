name: Build NEXORA Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore persistent Android debug signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v2

      - name: Create signing key if none exists
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \\
            -keystore "$HOME/.android/debug.keystore" \\
            -storepass android -keypass android \\
            -alias androiddebugkey -keyalg RSA -keysize 2048 \\
            -validity 10000 \\
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Save persistent Android debug signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nexora-android-debug-signing-key-v2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
